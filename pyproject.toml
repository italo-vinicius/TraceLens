[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tracelens"
version = "0.1.0"
description = "Streaming analysis of JSONL application logs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "orjson>=3.10,<4",
  "pydantic>=2.9,<3",
  "rich>=13.9,<14",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dashboard = ["plotly>=5.24,<6", "streamlit>=1.39,<2"]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
tracelens = "tracelens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tracelens"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["TraceLens_IMPLEMENTATION_PLAN.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
